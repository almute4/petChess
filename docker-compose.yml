services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: chess
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: chess
    ports: ["127.0.0.1:5433:5432"]
    volumes: [pgdata16:/var/lib/postgresql/data]

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U chess -d chess" ]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  pgdata16:
