services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: chess
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: chess
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql]

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U chess -d chess" ]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  pgdata:
