spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/chess
    username: chess
    password: chess
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format-sql: true

logging:
  level:
    org.hibernate.SQL: debug
jwt:
  secret: ${JWT_SECRET:default_local_dev_secret_key_32_chars_min}